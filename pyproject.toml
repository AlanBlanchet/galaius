[project]
name = "galaius"
version = "0.44.2"
description = "MCP server for browser + desktop automation with vision analysis"
readme = "README.md"
authors = [{ name = "Alan Blanchet", email = "alan@alan-blanchet.fr" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "automation", "browser", "desktop", "playwright", "vision", "agent", "llm"]
requires-python = ">=3.11"
dependencies = [
    "galaius-core @ git+https://github.com/AlanBlanchet/galaius-core.git@0a2c023536f0511158e86d3e9ac23acbdf67c857",
    "cyclopts>=3.0",
    "rich>=13.0",
    # /dev/uinput absolute input (X11 + Wayland). Same `evdev` import either way: prebuilt wheels
    # where PyPI has them, so a fresh machine needs no compiler or kernel headers.
    "evdev-binary>=2.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "evdev>=1.9; sys_platform == 'linux' and platform_machine != 'x86_64'",
    "python-xlib>=0.33; sys_platform == 'linux'", # enumerate override-redirect popups to composite into captures (#31)
    "mss>=9.0", # cross-platform screen capture for the macOS/Windows desktop backend (#24)
    "pynput>=1.7; sys_platform != 'linux'", # pointer + keyboard for the macOS/Windows desktop backend (#24); on Linux it would pull source-only evdev
    "pywin32>=306; sys_platform == 'win32'", # Windows: owner-only file ACLs + DPAPI for saved credentials (galaius/host/private_files.py)
    "tzdata>=2024.1; sys_platform == 'win32'",  # Windows has no zone database: a usage limit's reset hour reads its zone through it (galaius/agents/limits/quota.py)
    # wait_for text= on a desktop target reads the screen with the OS's own OCR (galaius/desktop/ocr.py)
    "winrt-runtime>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=3.2; sys_platform == 'win32'",
    "pyobjc-framework-Vision>=10; sys_platform == 'darwin'",
    "httpx>=0.28.1",
    "uv>=0.11.25,<0.12",  # installs each signed release beside the running one (galaius/upgrade/store.py `Uv`); the self-contained program carries no other
    "cryptography>=44",  # imported directly: verifies the ed25519 signature on every automatic upgrade (galaius/upgrade/source.py)
    "websockets>=14,<16",
    "litellm>=1.83.4,<2",
    "openai>=1.0",  # imported directly (vision/core.py maps its exception tree), not only via litellm
    "mcp[cli]>=1.27.0,<2",
    "numpy>=1.26",
    "pillow>=12.2.0",
    "playwright>=1.58.0,<2",
    "pydantic-settings>=2.13.1,<3",
    "pyyaml>=6.0,<7",
    "jsonschema>=4.23,<5",
    "textual>=8.2.7",
    "huggingface_hub>=0.35",  # fetches a workspace's own huggingface_repo model weights (galaius/inference/user_models.py); no torch dependency
    # create_file's formats (galaius/media/files.py), written locally: Word, Excel, PowerPoint (MIT), PDF from Typst (Apache-2.0)
    "python-docx>=1.2,<2",
    "openpyxl>=3.1.5,<4",
    "python-pptx>=1.0.2,<2",
    "typst>=0.15,<0.16",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/AlanBlanchet/galaius"
Repository = "https://github.com/AlanBlanchet/galaius"
Issues = "https://github.com/AlanBlanchet/galaius/issues"
Changelog = "https://github.com/AlanBlanchet/galaius/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "python-dotenv>=1.0.0",
    "pydantic-to-typescript>=2.0.0",
    "pytest-timeout>=2.3",
]

[project.optional-dependencies]
e2e = ["pytesseract>=0.3.10", "pillow>=12.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = [
    "galaius",
]
artifacts = [
    "galaius/browser/js/*.js",
    "galaius/data/*.json",
    "galaius/agents/transport/codex_app_server_schema/*.json",
]

[project.scripts]
galaius = "galaius.cli.app:main"
galaius-fetch-upstream = "galaius.catalog.upstream:_main"
galaius-sign-in-browser = "galaius.machine.sign_in_browser:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The repository root is importable: tests share helpers as `tests.support`, whether pytest runs as
# `pytest` (CI) or `python -m pytest`.
pythonpath = ["."]
norecursedirs = ["tests/fixtures", "tests/e2e"]
# Per-test timeout so a test that hangs (e.g. on Windows) FAILS with a traceback instead of
# blocking the whole job forever. "thread" method works on Windows (signal/SIGALRM is Unix-only).
timeout = 90
timeout_method = "thread"
markers = [
    "integration: tests that require external API calls and a real browser",
    "desktop: tests that require a live X11 display and AT-SPI",
]
