name: ci

# One workflow per push (so you don't see two runs for the same commit): the cross-OS test
# matrix + the Linux desktop job, and THEN — only if those pass, only on push to main — the
# tag/release job. Cross-OS uses GitHub's free macOS/Windows/Linux runners; integration tests
# (keys + real browser) and desktop tests (live display) auto-skip via tests/conftest.py.

on:
  push:
    branches: [main, "release/**"]  # release/X.Y branches cut maintenance patches for older lines
  pull_request:
  workflow_dispatch:  # the owner's release: Actions → ci → Run workflow on main

permissions:
  contents: read

env:
  PYTHONUTF8: "1"  # Windows console is cp1252 by default → ✓/→/… in output would crash

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]  # Windows: windows-suite below, in 8 shards
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20  # backstop: bound any real hang (pytest-timeout catches most first, at 90s)
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # tests/test_paths.py runs the extension's own TS path resolver through node to pin it to
      # the Python writer. Without node it would SKIP — silently unchecking the cross-language
      # contract in the one place it matters; the test hard-fails under CI rather than skipping.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Version files in sync (single source of truth)
        run: uv run python -m galaius.versioning check

      # The webview tests (chat composer, workplace) bundle with the extension's own esbuild.
      - name: Extension toolchain
        working-directory: clients/vscode
        run: npm ci

      # The page tests (chat composer, workplace) drive Playwright's own Chromium.
      - name: Playwright's Chromium
        run: uv run playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium

      # -rs lists every SKIP with its reason. Without it a test that quietly stops running —
      # a browser that will not launch, a missing display — is indistinguishable from one that
      # passed, and the suite keeps reporting green over a shrinking amount of actual coverage.
      - name: Run tests (integration + desktop auto-skip here)
        run: uv run pytest -m "not integration" -q -rs

      # The macOS runner is a real GUI session, so drive the PortableBackend (mss + pynput) on it
      # and SHOW the per-test result (-rs prints skip reasons): the visible mac desktop-automation
      # check (#24; Windows runs it inside windows-suite). Non-fatal — a host that denies
      # Screen-Recording/Accessibility skips with a diagnostic rather than failing.
      - name: Desktop automation (macOS real GUI)
        if: runner.os == 'macOS'
        run: uv run pytest tests/test_portable_backend.py -v -rs

  # The whole suite on Windows (integration and live-desktop tests auto-skip): every agent, console
  # and provider path a Windows PC runs, not only the install one. -rf names each failure.
  windows-suite:
    name: windows (suite ${{ matrix.shard }}/8)
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extension toolchain (the webview fixtures build with its own esbuild)
        working-directory: clients/vscode
        run: npm ci
      - name: This runner's share of the test files
        run: |
          # Every test file, sorted, dealt round-robin to 8 runners (pytest reads them from @shard.txt).
          $files = @(Get-ChildItem tests -Filter 'test_*.py' | Sort-Object Name)
          $mine = @(for ($i = 0; $i -lt $files.Count; $i++) { if ($i % 8 -eq ${{ matrix.shard }}) { "tests/$($files[$i].Name)" } })
          $mine | Set-Content -Encoding ascii shard.txt
          uv sync --frozen --quiet
          .venv\Scripts\python.exe -m playwright install chromium  # the page tests drive it
      # pytest under a watchdog of our own, well inside the step's limit: on a hang it prints the test
      # in progress and every process (who started what), then ends the tree - the log survives.
      - name: Tests
        timeout-minutes: 25
        run: |
          New-Item -ItemType File -Force empty.txt | Out-Null
          $pytest = Start-Process -FilePath .venv\Scripts\python.exe -PassThru -NoNewWindow -RedirectStandardInput empty.txt `
            -RedirectStandardOutput suite.log -RedirectStandardError suite.err `
            -ArgumentList '-m', 'pytest', '-m', '"not integration"', '-v', '-rfEs', '-p', 'no:cacheprovider', '@shard.txt'
          if (-not $pytest.WaitForExit(18 * 60 * 1000)) {
            "== HUNG: last lines"; Get-Content suite.log -Tail 40; Get-Content suite.err -Tail 40
            "== processes"; Get-CimInstance Win32_Process | Select-Object ProcessId, ParentProcessId, Name, CommandLine | Format-Table -AutoSize -Wrap | Out-String -Width 300
            taskkill /T /F /PID $pytest.Id
            exit 1
          }
          Get-Content suite.log; Get-Content suite.err
          exit $pytest.ExitCode
      - name: Upload the test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-suite-log-${{ matrix.shard }}
          path: suite.log
          if-no-files-found: warn

  # The extension is TypeScript that nothing else compiles: until now `tsc` ran only inside
  # publish-extension, i.e. on release tags only, so the extension source could sit broken on
  # main for weeks with no ordinary run noticing. This job typechecks + bundles on every push
  # and PR. (It would NOT by itself have caught the usage-log path drift — that was a runtime
  # semantic mismatch between two languages, and tests/test_paths.py is what pins it; this job
  # is what makes such a cross-language test compile-checked and runnable at all.)
  extension:
    name: extension (typecheck + bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: clients/vscode
    steps:
      - uses: actions/checkout@v4
      - name: Install uv  # compile runs the Python type/data generators
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install extension deps
        run: npm ci
      - name: Typecheck + bundle
        run: npm run compile
      # The .test.ts files were never executed by anything: there was no `test` script, CI ran
      # only `compile`, and tsconfig excludes them from the typecheck. Sixteen test files had
      # accumulated, all of them green locally and none of them a gate.
      - name: Unit tests
        run: npm test
      # Only src/generated/types.ts is tracked — settings.json/models.json/benchmarks.json are
      # gitignored and copied from the Python package at build time, so diffing them is a no-op.
      - name: Generated types are committed (in sync with the Python models)
        run: git diff --exit-code -- src/generated

  # Desktop automation CAN be tested in CI on Linux: Xvfb gives the runner a virtual
  # display, and the nested Xephyr sandbox drives real windows via xdotool/maim. (The
  # local uinput path needs /dev/uinput — privileged — so those tests stay opt-in/skipped.)
  desktop:
    name: desktop (Linux · Xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Desktop deps (nested sandbox + a Tk-capable Python + recorder)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xserver-xephyr xdotool maim x11-utils python3-tk ffmpeg
      - name: Nested desktop tests under a virtual display (recorded)
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x1024x24 >/dev/null 2>&1 &
          for _ in $(seq 1 30); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.5; done
          mkdir -p out
          # Record the virtual display so you can WATCH the runs afterwards (downloadable
          # artifact — runners are headless, but this is free within Actions storage limits).
          ffmpeg -y -loglevel error -f x11grab -video_size 1280x1024 -framerate 10 -i :99 \
            out/ci-desktop.mp4 >/dev/null 2>&1 &
          ff=$!
          uv run pytest tests/test_desktop_scenario.py -q; rc=$?
          kill "$ff" 2>/dev/null; sleep 1
          exit $rc
      - name: Upload the recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-recording
          path: out/ci-desktop.mp4
          if-no-files-found: warn

  # Tag + GitHub release — ONLY after the matrix + desktop jobs pass, and only when the owner
  # runs this workflow by hand on main or a release branch: a tag and a release are publications,
  # never a side effect of a push. Never tags a broken build. Single source of truth =
  # pyproject.toml version (must match package.json); no-ops if the tag already exists.
  release:
    needs: [test, windows-suite, desktop, extension]
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.tag.outputs.created }}
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read & verify version
        id: version
        run: |
          py=$(sed -nE 's/^version *= *"([^"]+)".*/\1/p' pyproject.toml | head -1)
          ext=$(sed -nE 's/.*"version" *: *"([^"]+)".*/\1/p' clients/vscode/package.json | head -1)
          if [ -z "$py" ]; then echo "::error::no version in pyproject.toml"; exit 1; fi
          if [ -n "$ext" ] && [ "$ext" != "$py" ]; then
            echo "::error::version mismatch — pyproject.toml=$py but package.json=$ext"; exit 1
          fi
          echo "version=$py" >> "$GITHUB_OUTPUT"
      - name: Create & push tag if new
        id: tag
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "$tag exists — nothing to do"; echo "created=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "galaius $tag"
          git push origin "$tag"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: GitHub release
        if: steps.tag.outputs.created == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true

  # Publish the VS Code extension to the Marketplace and Open VSX. Each step self-skips when
  # its token secret is absent, so the job (and the compile check) still runs on every release
  # without failing before the tokens are configured. Secrets: VSCE_PAT (Azure DevOps PAT,
  # Marketplace manage scope) and OVSX_PAT (open-vsx.org access token).
  publish-extension:
    needs: release
    if: ${{ needs.release.outputs.created == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/vscode
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv  # compile runs the Python type/data generators
        uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install extension deps
        run: npm ci
      - name: Build (compile + bundle) — also a per-release build check
        run: npm run compile
      - name: Publish to VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: npx @vscode/vsce publish -p "$VSCE_PAT"
      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: npx ovsx publish -p "$OVSX_PAT"
