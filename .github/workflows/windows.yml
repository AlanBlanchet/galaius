name: windows

# The Windows path a new user takes, end to end on a real Windows runner: the README's PowerShell
# one-liner (install.ps1, Windows PowerShell 5.1), `galaius login` approved like the owner does on
# /link (against tests/support/account_server.py, a server double speaking the real wire models),
# the background logon task running and stopped / started from the CLI, credentials sealed and
# private, `galaius logout` undoing it all; then the Windows-specific unit tests.

on:
  push:
    paths: [install.ps1, pyproject.toml, uv.lock, "src/**", "tests/**", .github/workflows/windows.yml]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  SERVER: http://127.0.0.1:8765

jobs:
  # The whole suite on Windows (integration and live-desktop tests auto-skip): every agent, console
  # and provider path a Windows PC runs, not only the install one. -rf names each failure.
  suite:
    name: windows (suite ${{ matrix.shard }}/8)
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extension toolchain (the webview fixtures build with its own esbuild)
        working-directory: clients/vscode
        run: npm ci
      - name: This runner's share of the test files
        run: |
          # Every test file, sorted, dealt round-robin to 8 runners (pytest reads them from @shard.txt).
          $files = @(Get-ChildItem tests -Filter 'test_*.py' | Sort-Object Name)
          $mine = @(for ($i = 0; $i -lt $files.Count; $i++) { if ($i % 8 -eq ${{ matrix.shard }}) { "tests/$($files[$i].Name)" } })
          $mine | Set-Content -Encoding ascii shard.txt
          uv sync --frozen --quiet
      # pytest under a watchdog of our own, well inside the step's limit: on a hang it prints the test
      # in progress and every process (who started what), then ends the tree - the log survives.
      - name: Tests
        timeout-minutes: 25
        run: |
          New-Item -ItemType File -Force empty.txt | Out-Null
          $pytest = Start-Process -FilePath .venv\Scripts\python.exe -PassThru -NoNewWindow -RedirectStandardInput empty.txt `
            -RedirectStandardOutput suite.log -RedirectStandardError suite.err `
            -ArgumentList '-m', 'pytest', '-m', '"not integration"', '-v', '-rfEs', '-p', 'no:cacheprovider', '@shard.txt'
          if (-not $pytest.WaitForExit(18 * 60 * 1000)) {
            "== HUNG: last lines"; Get-Content suite.log -Tail 40; Get-Content suite.err -Tail 40
            "== processes"; Get-CimInstance Win32_Process | Select-Object ProcessId, ParentProcessId, Name, CommandLine | Format-Table -AutoSize -Wrap | Out-String -Width 300
            taskkill /T /F /PID $pytest.Id
            exit 1
          }
          Get-Content suite.log; Get-Content suite.err
          exit $pytest.ExitCode
      - name: Upload the test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-suite-log-${{ matrix.shard }}
          path: suite.log
          if-no-files-found: warn

  windows:
    name: windows (install.ps1 + login + service)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # A Windows user folder with an accent (é): uv names its tool folder in UTF-8, which
      # Windows PowerShell must read as such to find galaius there.
      UV_TOOL_BIN_DIR: C:\Users\runneradmin\accentué\bin
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Serve install.ps1 over HTTP (what `irm` fetches)
        run: |
          Start-Process -FilePath python -ArgumentList '-m', 'http.server', '8799', '--bind', '127.0.0.1' -WindowStyle Hidden
          foreach ($i in 1..40) { try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8799/install.ps1 | Out-Null; break } catch { Start-Sleep -Milliseconds 500 } }

      - name: Install with the one-liner (Windows PowerShell 5.1, this commit's GitHub archive, a temp folder with a space, a French console)
        shell: powershell
        run: |
          $uv = Get-Command uv -ErrorAction SilentlyContinue
          Write-Host "uv before install: $(if ($uv) { $uv.Source } else { 'none (install.ps1 installs it)' })"
          # The default route (source archive + pinned galaius-core, no git), at this commit.
          $env:GALAIUS_ARCHIVE = "https://github.com/$env:GITHUB_REPOSITORY/archive/$env:GITHUB_SHA.zip"
          $env:TEMP = $env:TMP = New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'user name')
          $bin = $env:UV_TOOL_BIN_DIR
          # A French Windows console reads programs in code page 850 (the runner's reads UTF-8).
          powershell -ExecutionPolicy ByPass -c "[Console]::OutputEncoding = [Text.Encoding]::GetEncoding(850); irm http://127.0.0.1:8799/install.ps1 | iex"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$bin\galaius.exe" version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Start the server double
        run: |
          uv sync --frozen --quiet
          # Started through WMI: a process a step starts itself ends with that step, and this one serves every later step.
          $command = "cmd /c `"`"$PWD\.venv\Scripts\python.exe`" tests\support\account_server.py --port 8765 2> `"$PWD\server.err`"`""
          Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{ CommandLine = $command; CurrentDirectory = "$PWD" } | Format-List ProcessId, ReturnValue
          foreach ($i in 1..120) { try { irm "$env:SERVER/v1/version"; exit 0 } catch { Start-Sleep -Milliseconds 500 } }
          Get-Content server.err; exit 1

      - name: galaius login, approved on the double like the owner on /link
        run: |
          $login = Start-Process -FilePath galaius -ArgumentList 'login', '--server', $env:SERVER, '--no-browser', '--no-agents' `
            -RedirectStandardOutput login.out -RedirectStandardError login.err -PassThru -WindowStyle Hidden
          $code = $null
          foreach ($i in 1..120) { $code = (Select-String -Path login.out -Pattern '[B-Z]{4}-[B-Z]{4}' -ErrorAction SilentlyContinue | Select-Object -First 1).Matches.Value; if ($code) { break }; Start-Sleep -Milliseconds 500 }
          if (-not $code) { Get-Content login.out, login.err; throw 'no sign-in code printed' }
          irm -Method Post "$env:SERVER/test/approve" -ContentType application/json -Body (@{ user_code = $code } | ConvertTo-Json) | ConvertTo-Json -Compress
          if (-not $login.WaitForExit(180000)) { throw 'galaius login did not finish' }
          Get-Content login.out, login.err
          if ($login.ExitCode -ne 0 -or -not (Select-String -Path login.out -Pattern '^Connected: ' -Quiet)) { throw "galaius login failed (exit $($login.ExitCode))" }
          # The double serves no agent catalog (a 404 is expected there); refusing its own files is a Windows defect.
          if (Select-String -Path login.out, login.err -Pattern 'must be private' -Quiet) { throw 'galaius refused its own files as not private' }

      - name: The logon task runs; the machine is online with Windows' script languages
        run: |
          galaius machine service status | Tee-Object -Variable status
          if ("$status" -notmatch 'Background service: running') { throw 'service not running' }
          Get-ScheduledTask -TaskName 'Galaius machine *' | Format-List TaskName, State, Principal, Triggers, Actions
          $machine = (irm "$env:SERVER/test/state").machines[0]
          $machine | ConvertTo-Json -Compress
          if (-not $machine.online) { throw 'machine not online' }
          foreach ($want in 'script:python', 'script:powershell', 'script:cmd') { if ($machine.features -notcontains $want) { throw "missing $want" } }
          if ($machine.features -contains 'script:shell') { throw 'announces shell, which Windows cannot run' }

      - name: Credentials are DPAPI-sealed and private to this user
        run: |
          $files = @("$HOME\.config\galaius\machine.json") + (Get-ChildItem "$HOME\.galaius\credentials\*.key").FullName
          $token = (Get-Content -Raw $files[0] | ConvertFrom-Json).token
          if (-not $token.StartsWith('dpapi:')) { throw 'machine token stored unsealed' }
          foreach ($file in $files[1..($files.Length - 1)]) { if (-not (Get-Content -Raw $file).StartsWith('dpapi:')) { throw "$file stored unsealed" } }
          foreach ($file in $files) {
            icacls $file
            if ((icacls $file) -match 'Everyone|BUILTIN\\Users|Authenticated Users') { throw "$file readable by others" }
          }

      - name: Stop and start it from the CLI
        run: |
          galaius machine service stop
          foreach ($i in 1..60) { if (-not (irm "$env:SERVER/test/state").machines[0].online) { break }; Start-Sleep -Milliseconds 500 }
          if ((irm "$env:SERVER/test/state").machines[0].online) { throw 'still online after stop' }
          galaius machine service status | Tee-Object -Variable status
          if ("$status" -notmatch 'stopped') { throw 'status does not say stopped' }
          galaius machine service start
          foreach ($i in 1..60) { $m = (irm "$env:SERVER/test/state").machines[0]; if ($m.online -and $m.connections -ge 2) { break }; Start-Sleep -Milliseconds 500 }
          if (-not $m.online -or $m.connections -lt 2) { throw 'not reconnected after start' }
          "reconnected: connections=$($m.connections)"

      - name: Script steps run through the logon task (PowerShell, cmd, Python; shell refused), barred from the clipboard
        run: |
          galaius machine permission full_access
          Set-Clipboard -Value 'clipboard-secret'
          if ((Get-Clipboard) -ne 'clipboard-secret') { throw 'this session has no clipboard: the clipboard check would prove nothing' }
          function Step($language, $source) { irm -Method Post "$env:SERVER/test/run" -ContentType application/json -Body (@{ language = $language; source = $source } | ConvertTo-Json) }
          $steps = [ordered]@{
            powershell = Step powershell "`"ps-ok `$(`$PSVersionTable.PSEdition) `$PWD`""
            cmd = Step cmd "@echo off`r`necho cmd-ok %CD%`r`n"
            python = Step python "import sys; print('py-ok', sys.platform)`n"
            shell = Step shell "echo sh`n"
            clipboard = Step powershell "Get-Clipboard"
          }
          $steps.GetEnumerator() | ForEach-Object { "$($_.Key): $($_.Value | ConvertTo-Json -Compress)" }
          foreach ($ok in 'powershell', 'cmd', 'python') { if ($steps[$ok].status -ne 'succeeded') { throw "$ok step failed" } }
          if ($steps.powershell.result -notmatch 'ps-ok' -or $steps.cmd.result -notmatch 'cmd-ok' -or $steps.python.result -notmatch 'py-ok win32') { throw 'unexpected step output' }
          if ($steps.shell.status -ne 'failed' -or $steps.shell.error -notmatch 'PowerShell or cmd') { throw 'shell was not refused in plain words' }
          if ("$($steps.clipboard.result)" -match 'clipboard-secret') { throw 'a step read the signed-in user''s clipboard' }

      - name: A non-administrator can register the same logon task
        run: |
          $password = "Aa1!" + [Guid]::NewGuid().ToString('N')
          $secure = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name interacttest -Password $secure -AccountNeverExpires | Out-Null
          # galaius's own definition, from the installed build, naming the test user instead of this one.
          $python = Join-Path (uv tool dir).Trim() 'galaius\Scripts\python.exe'
          & $python -c "from galaius.machine_service import WindowsMachineService as S; print(S().definition().replace(S.user(), r'$env:COMPUTERNAME\interacttest'))" |
            Out-File -Encoding unicode "$env:PUBLIC\task-user.xml"
          Get-Content "$env:PUBLIC\task-user.xml"
          $script = "try { Register-ScheduledTask -TaskName 'Galaius machine test' -Xml (Get-Content -Raw '$env:PUBLIC\task-user.xml') | Out-Null; " +
                    "`$admin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole('Administrators'); " +
                    "'registered by ' + [Environment]::UserName + ', administrator: ' + `$admin | Out-File '$env:PUBLIC\result.txt'; " +
                    "Unregister-ScheduledTask -TaskName 'Galaius machine test' -Confirm:`$false } catch { 'refused: ' + `$_ | Out-File '$env:PUBLIC\result.txt' }"
          $credential = New-Object System.Management.Automation.PSCredential("$env:COMPUTERNAME\interacttest", $secure)
          Start-Process -FilePath powershell -ArgumentList '-NoProfile', '-Command', $script -Credential $credential -Wait -WorkingDirectory $env:PUBLIC
          Get-Content "$env:PUBLIC\result.txt" | Tee-Object -Variable result
          if ("$result" -notmatch '^registered by interacttest, administrator: False') { throw "unelevated registration: $result" }

      - name: galaius logout removes the task and the credentials
        run: |
          galaius logout
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (Get-ScheduledTask -TaskName 'Galaius machine *' -ErrorAction SilentlyContinue) { throw 'logon task still registered' }
          if (Test-Path "$HOME\.config\galaius\machine.json") { throw 'machine credential left behind' }
          $machine = (irm "$env:SERVER/test/state").machines[0]
          if (-not $machine.revoked -or $machine.online) { throw 'server did not see the logout' }

      - name: Windows unit tests (private files, lock, scripts in PowerShell and cmd, login, safe folders)
        run: >-
          uv run --frozen python -m pytest -q -rs tests/test_private_files.py tests/test_account_login.py tests/test_machines.py
          tests/test_pinned_directory.py tests/test_machine_data.py tests/test_server_prompt_projection.py
          tests/test_agent_registry.py::test_registry_refuses_hostile_writes_through_a_leaf_link
          tests/test_agent_registry.py::test_registry_record_reads_never_follow_a_link_swapped_in_during_open
          tests/test_agent_registry.py::test_public_registry_reads_never_follow_hostile_private_leaves
          tests/test_prompt_cli.py::test_prompt_editor_rejects_a_symlink_out_of_the_source
          tests/test_prompt_cli.py::test_prompt_editor_releases_its_lock_when_post_lock_validation_fails
          tests/test_prompt_cli.py::test_prompt_editor_stores_the_exact_bytes_it_reports
          tests/test_prompt_contracts.py::test_cache_is_never_opened_through_a_link
          tests/test_prompt_contracts.py::test_cache_owner_check_is_portable_when_getuid_is_unavailable
          tests/test_prompt_projection.py::test_installer_switches_only_declared_consumers_and_rejects_unmanaged_collision
          --deselect tests/test_server_prompt_projection.py::test_independent_connection_processes_lock_before_reading_shared_install_state

      - name: Logs
        if: always()
        run: |
          foreach ($file in 'server.err', 'login.out', 'login.err', "$HOME\.config\galaius\machine-service.log") { if (Test-Path $file) { "== $file"; Get-Content $file -Tail 80 } }

  # Installed by the real one-liner, then a newer runtime lands in the store: the installer's own
  # galaius.exe must run it (every command follows the newest runtime); then a running MCP server
  # and machine connection upgrade N -> N+1 by themselves (tests/test_upgrade_integration.py).
  upgrade:
    name: windows (auto-upgrade after install.ps1)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Serve install.ps1 over HTTP (what `irm` fetches)
        run: |
          Start-Process -FilePath python -ArgumentList '-m', 'http.server', '8799', '--bind', '127.0.0.1' -WindowStyle Hidden
          foreach ($i in 1..40) { try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8799/install.ps1 | Out-Null; break } catch { Start-Sleep -Milliseconds 500 } }
      - name: Install with the one-liner (this commit's GitHub archive)
        shell: powershell
        run: |
          $env:GALAIUS_ARCHIVE = "https://github.com/$env:GITHUB_REPOSITORY/archive/$env:GITHUB_SHA.zip"
          powershell -ExecutionPolicy ByPass -c "irm http://127.0.0.1:8799/install.ps1 | iex"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Offered a release of the commit it was installed from, the fresh install is up to date
        run: |
          $python = Join-Path (uv tool dir).Trim() 'galaius\Scripts\python.exe'
          & $python -I tests\support\fresh_install_check.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: galaius-core at the commit this checkout pins
        run: |
          $sha = [regex]::Match((Get-Content -Raw pyproject.toml), 'galaius-core\.git@([0-9a-f]{40})').Groups[1].Value
          git clone -q https://github.com/AlanBlanchet/galaius-core "$env:RUNNER_TEMP\galaius-core"
          git -C "$env:RUNNER_TEMP\galaius-core" checkout -q $sha
          "GALAIUS_CORE_SOURCE=$env:RUNNER_TEMP\galaius-core" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: A newer runtime in the store is what the installer's galaius.exe runs
        run: |
          uv sync --frozen --quiet
          $newer = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\newer"
          Copy-Item -Recurse src, pyproject.toml, uv.lock, README.md, LICENSE $newer
          (Get-Content -Raw "$newer\pyproject.toml") -replace '(?m)^version = "[^"]+"', 'version = "9.9.9"' | Set-Content -NoNewline "$newer\pyproject.toml"
          uv build --wheel --quiet -o "$env:RUNNER_TEMP\wheels" $newer
          uv build --wheel --quiet -o "$env:RUNNER_TEMP\wheels" $env:GALAIUS_CORE_SOURCE
          $public = (Get-ChildItem "$env:RUNNER_TEMP\wheels\galaius-9.9.9-*.whl").FullName
          $core = (Get-ChildItem "$env:RUNNER_TEMP\wheels\galaius_core-*.whl").FullName
          .venv\Scripts\python.exe scripts\install_runtime.py --public-wheel $public --core-wheel $core --checkout .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $installed = Join-Path (uv tool dir --bin).Trim() 'galaius.exe'  # where the one-liner put it
          $version = (& $installed --version).Trim()
          "installer's galaius.exe runs $version"
          if ($version -ne '9.9.9') { throw "the installer's galaius.exe runs $version, not the active runtime 9.9.9" }
      - name: Running processes upgrade N -> N+1 (and the handoff / release rules)
        run: uv run --frozen python -m pytest -v -rfEs -p no:cacheprovider tests/test_upgrade_integration.py tests/test_upgrade_release.py tests/test_handoff.py
