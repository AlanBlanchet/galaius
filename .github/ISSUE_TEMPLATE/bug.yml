name: Bug
description: galaius did the wrong thing, or reported success without doing anything.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What you asked for, and what galaius did
      placeholder: |
        Asked: click the "Sign in" button on localhost:3000
        galaius said: clicked ref=e12
        Actually happened: the page never changed
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version
      description: "`galaius --version`, and the VS Code extension version if you use it."
    validations: { required: true }
  - type: input
    id: platform
    attributes:
      label: OS and surface
      placeholder: "Ubuntu 24.04 / MCP in Claude Code — or macOS / CLI / VS Code extension"
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Anything galaius printed
      description: Error text or the tool's reply. Remove tokens and private URLs first.
      render: shell
